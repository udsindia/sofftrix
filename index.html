<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F5F1" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Title, description, canonical, share tags, and structured data for
         each page are written here at build time by scripts/prerender.js,
         from src/seo.js. In dev, <PageMeta> in App.jsx fills them in. -->
    <!--seo-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Scroll reveals start hidden and are shown by JavaScript. Without it,
         show everything. -->
    <noscript><style>.reveal { opacity: 1; transform: none; }</style></noscript>
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
