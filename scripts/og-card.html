<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f6f5f1; color: #0e0e10; font-family: Geist, sans-serif;
    padding: 0 48px;
  }
  .frame {
    height: 630px; border-inline: 1px solid #e4e1d9; display: flex; flex-direction: column;
    background-image: radial-gradient(#e4e1d9 1px, transparent 1px); background-size: 22px 22px;
  }
  .bar {
    display: flex; justify-content: space-between; padding: 26px 48px;
    font: 500 15px 'Geist Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: #6f6e73;
    border-bottom: 1px dashed #e4e1d9; background: #f6f5f1;
  }
  .wm { letter-spacing: .22em; color: #0e0e10; }
  .wm .a { color: #e0580f; } .wm .c { color: #2f5bea; }
  .main { flex: 1; display: flex; align-items: center; gap: 48px; padding: 0 48px; }
  h1 { font-weight: 500; font-size: 68px; line-height: 1.02; letter-spacing: -.045em; width: 620px; }
  h1 span { color: #2f5bea; }
  .sub { margin-top: 22px; font-size: 22px; color: #6f6e73; }
  .clock { flex: 1; text-align: center; padding: 28px 0; background: #fff; border: 1px solid #e4e1d9; border-radius: 6px; }
  .clock b { display: block; font: 500 128px/1 'Geist Mono', monospace; letter-spacing: -.06em; }
  .clock b i { font-style: normal; color: #2f5bea; }
  .clock small { display: block; margin-top: 12px; font: 500 14px 'Geist Mono', monospace; letter-spacing: .1em; color: #6f6e73; text-transform: uppercase; }
  .hatch { height: 26px; border-top: 1px solid #e4e1d9; background: repeating-linear-gradient(-45deg, #cfcbc0 0 1px, transparent 1px 7px); }
</style>
</head>
<body>
  <div class="frame">
    <div class="bar"><span class="wm"><span class="a">SO</span>FFT<span class="c">RIX</span></span><span>VUTrak · WhatsApp lead CRM</span></div>
    <div class="main">
      <div>
        <h1>Reach every new lead in <span>four seconds</span>.</h1>
        <p class="sub">The first reply goes out on WhatsApp — automatically.</p>
      </div>
      <div class="clock"><b>0:0<i>4</i></b><small>lead → first message</small></div>
    </div>
    <div class="hatch"></div>
  </div>
</body>
</html>
